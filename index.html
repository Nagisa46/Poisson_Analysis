<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poisson Analysis Apps</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: #0d1117;
  color: #f0f6fc;
  display: grid;
  place-items: center;
  padding: 22px;
}
.wrap {
  width: min(100%, 520px);
}
h1 {
  font-size: 28px;
  line-height: 1.15;
  margin: 0 0 8px;
}
p {
  color: #9da7b3;
  line-height: 1.5;
  margin: 0 0 20px;
}
.links {
  display: grid;
  gap: 12px;
}
a {
  display: block;
  text-decoration: none;
  color: inherit;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 16px;
}
a:active, a:hover {
  border-color: #2ea043;
}
.title {
  display: block;
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 4px;
}
.desc {
  display: block;
  color: #9da7b3;
  font-size: 13px;
  line-height: 1.4;
}
</style>
</head>
<body>
<main class="wrap">
  <h1>Poisson Analysis Apps</h1>
  <p>Choose which app to open. These links are designed for stable GitHub Pages access on mobile.</p>
  <nav class="links" aria-label="App links">
    <a href="./main-app/">
      <span class="title">Poisson Pro</span>
      <span class="desc">Original main branch calculator.</span>
    </a>
    <a href="./bet-assist-app/">
      <span class="title">HuTao Bet Assistant</span>
      <span class="desc">Bet assistant branch app with history, stats, EV, AH, O/U, and Kelly tools.</span>
    </a>
  </nav>
</main>
</body>
</html>
